
<!DOCTYPE html>
<html>
<head>
  <title>Cosmic Chaos</title>
  <style>
    body {
      background: radial-gradient(circle, #25255c, #050510);
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 45px;
      text-shadow: 0 0 20px cyan;
    }

    button {
      background: cyan;
      color: black;
      border: none;
      padding: 18px 30px;
      border-radius: 15px;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.15);
      background: magenta;
    }

    #output {
      font-size: 25px;
      margin-top: 35px;
    }
  </style>
</head>
<body>

  <h1>🌌 COSMIC CHAOS</h1>
  <p>Press the button to disturb the universe.</p>

  <button onclick="generate()">
    CREATE CHAOS
  </button>

  <div id="output">Waiting...</div>

  <script>
    const chaos = [
      "🪐 SATURN HAS LEFT ORBIT",
      "🌍 EARTH IS BUFFERING",
      "☄️ ASTEROID DETECTED",
      "👽 ALIEN WIFI CONNECTED",
      "💀 UNIVERSE.EXE CRASHED",
      "🌌 GALAXY NOT FOUND",
      "🧀 THE MOON IS CHEESE"
    ];

    function generate() {
      const random = Math.floor(Math.random() * chaos.length);
      document.getElementById("output").textContent = chaos[random];
    }
  </script>

</body>
</html>
